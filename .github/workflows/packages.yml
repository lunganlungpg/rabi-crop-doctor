# Publishes @lunganlungpg/rabi-crop-doctor (npm) and ghcr.io/lunganlungpg/rabi-crop-doctor (Container)
# directly to GitHub Packages so Rabi Crop Doctor appears under the repository Packages tab.
name: Publish GitHub Packages (Container & npm)

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "package.json"
      - "index.js"
      - "pyproject.toml"
      - "Dockerfile"
      - "python/**"
      - "web/js/**"
      - "models/android_models.json"
      - ".github/workflows/packages.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"

      - name: Verify package syntax and exports
        run: npm run check && npm test

      - name: Publish @lunganlungpg/rabi-crop-doctor to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish || echo "Version already published; bump package.json version for next release."

  publish-container-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rabi-crop-doctor
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push container image to GitHub Packages
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
