name: CI — Parity, Models & Multi-Language Package Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-python-and-node:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies & package editable
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps .

      - name: Validate agronomic JSON, incidence script & package CLI fallback
        run: |
          python -c "import json; json.load(open('data/rabi_crops_knowledge.json', encoding='utf-8'))"
          python python/disease_incidence.py
          rabi-doctor dataset_samples/wheat_yellow_rust_sample_1.png --crop wheat

      - name: Verify JavaScript & npm package exports
        run: npm run check && npm test

      - name: Reproduce ML/ANN training & run Python <-> JS parity suite
        run: |
          python python/train_and_evaluate.py
          python tests/test_parity_and_pipeline.py

  verify-r-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install rabidoctor R package and run tests
        run: |
          R CMD INSTALL R-package
          Rscript R-package/tests/run_tests.R
