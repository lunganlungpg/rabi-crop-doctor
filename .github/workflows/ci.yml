name: CI — Parity, Models & Assets Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate agronomic JSON & surveillance CSV
        run: |
          python -c "import json; json.load(open('data/rabi_crops_knowledge.json', encoding='utf-8'))"
          python python/disease_incidence.py

      - name: Verify JavaScript syntax
        run: |
          node --check web/js/feature_extractor.js
          node --check web/js/inference_engine.js
          node --check web/js/app.js

      - name: Reproduce ML/ANN training from feature dataset
        run: python python/train_and_evaluate.py

      - name: Run Python <-> JS feature parity & epidemiology test suite
        run: python tests/test_parity_and_pipeline.py
